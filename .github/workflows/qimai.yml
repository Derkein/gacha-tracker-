name: Qimai revenue (daily)

# Qimai's China-iPhone per-banner revenue layer. Drives a logged-in headless browser against
# Qimai's free 3-app/day account; the six games rotate (group A / group B by day-of-year
# parity) to stay inside that cap.
#
# ⚠ MANUAL ONLY — no daily schedule. Qimai binds the login session to the IP it was created
# on, so a cookie captured at home is REJECTED from GitHub's datacenter (the run logs
# "NOT LOGGED IN"). The real daily run therefore happens LOCALLY on the owner's machine via
# scripts/qimai_daily.ps1 (Windows Task Scheduler). This workflow is kept only for a manual
# test from the Actions tab; set the QIMAI_COOKIE secret first. Nothing here forges Qimai's
# request signature — a real browser runs Qimai's own JS.
on:
  workflow_dispatch:          # manual run from the Actions tab (see note above — CI can't auth)

concurrency:
  group: qimai                # never two of these at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qimai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch today's Qimai revenue (rotating 3 games)
        env:
          QIMAI_COOKIE: ${{ secrets.QIMAI_COOKIE }}   # account session cookie; refresh ~monthly
        run: python scripts/fetch_qimai_today.py
        continue-on-error: true    # a stale cookie or a capped day is a missed day, not a
                                   # build failure — the commit step just finds nothing new

      - name: Rebuild data/qimai.json from the raw daily
        run: python scripts/build_qimai.py

      - name: Commit the day
        run: |
          git config user.name  "Derkein"
          git config user.email "55472705+Derkein@users.noreply.github.com"
          git add data/qimai_daily data/qimai.json
          if git diff --cached --quiet; then
            echo "No new Qimai days."
          else
            git commit -m "chore: Qimai revenue for $(date -u +%Y-%m-%d)"
            # other workflows commit to the same branch; land on top of them rather than
            # failing the push
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "push attempt $attempt lost a race; retrying"
              sleep 5
            done
            echo "could not push after 3 attempts" >&2
            exit 1
          fi
