name: Refresh gacha data

# Re-scrapes game-i.daa.jp, refreshes character icon maps, and commits any
# changes back to main. GitHub Pages (deploy-from-branch) then redeploys.
on:
  schedule:
    # game-i rolls its daily tally at 00:00 JST (15:00 UTC). GitHub delays these
    # heavily: measured over the last 20 scheduled runs on this repo, they fired
    # 84-221 min late (median 144), so all three slots land ~17:45-19:15 UTC and
    # the staggering below buys less than it looks. It still works -- the data is
    # long since rolled by then -- and the "no changes" guard plus the refresh-data
    # concurrency group make the extra runs cheap no-ops. Don't read the times
    # below as when the job actually runs.
    - cron: "10 15 * * *"    # 00:10 JST — target (10 min after the rollover)
    - cron: "40 15 * * *"    # 00:40 JST — fallback if the first is delayed/dropped
    - cron: "20 16 * * *"    # 01:20 JST — last-chance fallback
  push:
    branches: [main]          # refresh data right after every CODE push
    paths-ignore:             # ...but NOT after data-only pushes (the daily Qimai/CN
      - 'data/**'             # commits, or this workflow's own): re-scraping game-i and
      - 'icons/**'            # re-verifying ~100 banner-art links on every data commit is
                              # wasteful. Scheduled runs + code pushes keep data fresh.
                              # (no loop either way: the bot's GITHUB_TOKEN commit never
                              #  triggers workflows.)
  workflow_dispatch:          # allow manual runs from the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write             # needed to push the updated JSON

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Install dependencies (for face-crop icons)
        run: pip install -r requirements.txt

      - name: Refresh character icon maps (Enka + StarRailRes)
        run: python scripts/build_icons.py
        continue-on-error: true    # never block a data refresh if a source is down

      - name: Scrape banner revenue (game-i)
        run: python scripts/scrape.py

      - name: Snapshot store charts (China iOS top-grossing, Steam top sellers)
        run: python scripts/scrape_ranks.py
        continue-on-error: true    # history grows one day at a time; a miss is one gap,
                                   # never a failed refresh

      - name: Scrape external monthly revenue (eog.gg / Sensor Tower)
        run: python scripts/scrape_external.py
        continue-on-error: true    # comparison layer; never block a game-i refresh

      - name: Attach character portraits
        run: python scripts/enrich_icons.py

      - name: Translate names (refresh maps so new characters get picked up)
        run: python scripts/translate_names.py --refresh
        continue-on-error: true

      - name: Repair dead banner-art links (Genshin, via paimon.moe)
        run: python scripts/fix_banner_art.py
        continue-on-error: true    # best-effort; portrait fallback covers any miss

      - name: Crop face icons from banner art (icon-less games)
        run: python scripts/face_icons.py
        continue-on-error: true    # face detection is best-effort

      - name: Sample bar colors from banner art
        run: python scripts/bar_colors.py
        continue-on-error: true

      - name: Check version buckets (warn if a new major version needs adding)
        run: python scripts/check_versions.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name  "Derkein"
          git config user.email "55472705+Derkein@users.noreply.github.com"
          git add data icons
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh gacha data ($(date -u +%Y-%m-%d))"
            # The China chart workflow commits to this same branch, so a plain push
            # loses the race whenever the two overlap (they share a 16:20/16:30 UTC
            # window and GitHub fires both late). Land on top of whatever arrived
            # while we were scraping, and retry once if it moves again mid-push.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "push attempt $attempt lost a race; retrying"
              sleep 5
            done
            echo "could not push after 3 attempts" >&2
            exit 1
          fi
